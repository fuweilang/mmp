# Keyless generic ACP v1 control-surface patch over `mmp --profile acp`.

- id: llm-deepseek
  name: '@mammoth-ai/mmp-llm-deepseek-api-key'
  disabled: true

- id: acp
  name: '@mammoth-ai/mmp-acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@mammoth-ai/mmp-session-persistence-jsonl'
  config:
    root: !!js process.env.MMP_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
