- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@mammoth-ai/mmp-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max

- insert:
    - id: worktree
      name: '@mammoth-ai/mmp-experimental-worktree'
    - id: tool-worktree
      name: '@mammoth-ai/mmp-experimental-tool-worktree'
