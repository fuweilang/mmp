# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: llm-deepseek
  name: '@mammoth-ai/mmp-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: lsp
      name: '@mammoth-ai/mmp-lsp'
    - id: lsp-stdio
      name: '@mammoth-ai/mmp-lsp-stdio'
      config:
        servers:
          fixture:
            command: !!js process.execPath
            args: ['./lsp-server.mjs']
            extensionToLanguage:
              '.ts': typescript
    - id: tool-lsp
      name: '@mammoth-ai/mmp-tool-lsp'
      config:
        maxLocations: 1
    - id: llm-replay
      name: '@mammoth-ai/mmp-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@mammoth-ai/mmp-tool-call-timeout-policy'

- id: plugin-package-inventory-deepseek
  disabled: true
