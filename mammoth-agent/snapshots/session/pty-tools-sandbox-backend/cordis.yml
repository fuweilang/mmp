# Opt-in persistent PTY composition for the PTY snapshot scenario. The base
# deployment already owns the shared sandbox provider and policy.
- insert:
    - id: pty
      name: '@mammoth-ai/mmp-terminal'
    - id: terminal-bash
      name: '@mammoth-ai/mmp-terminal-bash'
      config:
        pollIntervalMs: 10
        exactProbeAfterMs: 20
        idleSilenceMs: 250
        handoffGraceMs: 250
        timeoutMs: 2000
        disposeGraceMs: 500
    - id: tool-terminal
      name: '@mammoth-ai/mmp-tool-terminal'
