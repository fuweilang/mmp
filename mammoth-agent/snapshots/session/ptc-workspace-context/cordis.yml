# PTC mode agent-instructions snapshot recording overlay. The default filesystem
# tools trigger nested instruction discovery after a read.
- insert:
    - id: literal-sdk
      name: '../../../packages/core/tools/tests/fixtures/literal-sdk.ts'

- id: agent-default-model
  name: '@mammoth-ai/mmp-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@mammoth-ai/mmp-session-persistence-jsonl'
  config:
    root: !!js mmpHomePath('sessions')
    compression: !!js 'process.env.MMP_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@mammoth-ai/mmp-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: system-prompt
  name: '@mammoth-ai/mmp-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.
