# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-deepseek
  name: '@mammoth-ai/mmp-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@mammoth-ai/mmp-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-pro

- id: subprocess
  name: '@mammoth-ai/mmp-subprocess-local'

- id: bash-sandbox
  name: '@mammoth-ai/mmp-bash-sandbox'
  disabled: true

- id: pwsh-sandbox
  name: '@mammoth-ai/mmp-pwsh-sandbox'
  disabled: false

- id: shell-env
  name: '@mammoth-ai/mmp-shell-env'

- id: agent-default-model
  name: '@mammoth-ai/mmp-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@mammoth-ai/mmp-session-persistence-jsonl'
  config:
    root: !!js mmpHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@mammoth-ai/mmp-agent-instructions'
  disabled: true

- id: system-prompt
  name: '@mammoth-ai/mmp-system-prompt'
  config:
    personaPrefix: You are a concise snapshot agent.

- id: goal
  name: '@mammoth-ai/mmp-goal'
  disabled: true

- id: goal-round-driver
  name: '@mammoth-ai/mmp-goal-round-driver'
  disabled: true

- id: command-goal
  name: '@mammoth-ai/mmp-command-goal'
  disabled: true

- id: tool-goal
  name: '@mammoth-ai/mmp-tool-goal'
  disabled: true

- id: skill
  name: '@mammoth-ai/mmp-skill'
  disabled: true

- id: skill-filesystem
  name: '@mammoth-ai/mmp-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@mammoth-ai/mmp-tool-skill'
  disabled: true

- id: tool-bash
  name: '@mammoth-ai/mmp-tool-bash'
  disabled: true

- id: tool-pwsh
  name: '@mammoth-ai/mmp-tool-pwsh'
  disabled: false
