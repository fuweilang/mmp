# Keyless twin of subagent-acp-diagnostic.cordis.yml: keep the real ACP child
# permission-denial path and replace only the external parent model adapter.
- id: llm-deepseek
  name: '@mammoth-ai/mmp-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: acp-diagnostic-settlement-order
      name: './settlement-order.mjs'
    - id: llm-replay
      name: '@mammoth-ai/mmp-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: subagent-acp-diagnostic
      name: '@mammoth-ai/mmp-subagent-acp'
      config:
        providerName: acp-diagnostic
        command: !!js process.execPath
        args:
          - !!js "decodeURIComponent(new URL('../../../packages/subagent/subagent-acp/tests/mock-acp-server.ts', 'file://' + process.env.MMP_SNAPSHOT_FILE).pathname)"
        permission: reject
        env:
          MOCK_PERMISSION: '1'
          MOCK_TOOL_KIND: execute
    - id: tool-subagent-acp-diagnostic
      name: '@mammoth-ai/mmp-tool-subagent'
      config:
        provider: acp-diagnostic
        toolName: subagent_acp
        maxDepth: provider-managed

- id: plugin-package-inventory-deepseek
  disabled: true
