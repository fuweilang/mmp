# 对话模式：不注册工具，闲聊走模型直出（网关因此不会强制开 thinking）。
# 干活请切到「标准模式」。
- insert:
    - id: preset-chat
      name: '@mammoth-ai/mmp-agent-preset'
      config:
        id: chat
        name: 对话模式
        description: 只聊天，不调用工具，回答更快。改文件、跑命令或做任务时请切到「标准模式」。
        order: 0
        plugins:
          - id: persona
            name: '@mammoth-ai/mmp-persona'
            config:
              prefix: >-
                You are a helpful assistant. Answer the user's question directly.
                Do not ask clarifying questions for typos or short chat.
                Do not call tools.
              complete: true
              includeRuntimeContext: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@mammoth-ai/mmp-compaction-basic'
              - id: command-compact
                name: '@mammoth-ai/mmp-command-compact'
