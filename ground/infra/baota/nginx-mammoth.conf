# 猛犸智能体路径。挂在 www.mmai.vip server 内，不改 / /system /workbench /v2。
# 由 extension include 加载。

# 桌面客户端与热更新产物。文件放到 /www/mammoth/downloads/：
#   mammoth-agent-mac-arm64.dmg / mammoth-agent-mac-x64.dmg / mammoth-agent-win.exe
#   mammoth-latest.json
#   mammoth-portable-<plat>-<version>.zip   # plat = darwin-arm64|darwin-amd64|windows-amd64|…
# 不要再用 mammoth-agent.dmg（线上曾误放成 PeecAI 协同工作台）。
# MAMMOTH-PATCH: location 前缀从 mammoth-agent 扩到 mammoth-，以覆盖 latest.json 与 portable zip。
location = /downloads/mammoth-agent.dmg {
    return 302 /downloads/mammoth-agent-mac-arm64.dmg;
}
location = /downloads/mammoth-agent-x86_64.dmg {
    return 302 /downloads/mammoth-agent-mac-x64.dmg;
}
location = /downloads/mammoth-agent.exe {
    return 302 /downloads/mammoth-agent-win.exe;
}
location = /downloads/mammoth-latest.json {
    alias /www/mammoth/downloads/mammoth-latest.json;
    default_type application/json;
    etag on;
    expires off;
    add_header Cache-Control "no-cache";
}
location ^~ /downloads/mammoth- {
    alias /www/mammoth/downloads/mammoth-;
    default_type application/octet-stream;
    add_header Content-Disposition "attachment";
    # no-cache = 用前先问服务器；文件没变回 304，覆盖上传后下新包。
    etag on;
    expires off;
    add_header Cache-Control "no-cache";
}

location = /mengma-logo.png { alias /www/mammoth/web/mengma-logo.png; }
location = /logo-icon.png { alias /www/mammoth/web/logo-icon.png; }
location = /favicon.png { alias /www/mammoth/web/favicon.png; }

location ^~ /assets/ {
    root /www/mammoth/web;
    expires 7d;
    access_log off;
}

location = /login {
    root /www/mammoth/web;
    try_files /index.html =404;
}
location ^~ /login/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /console { return 301 /console/; }
location = /console/login { return 302 /login; }
location ^~ /console/login/ { return 302 /login; }
location ^~ /console/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-mammoth-public-api /console/api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 50m;
}
location ^~ /console/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /admin { return 301 /admin/; }
location ^~ /admin/api/ {
    proxy_pass http://127.0.0.1:3100/api/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 50m;
}
location ^~ /admin/ {
    root /www/mammoth/web;
    try_files /index.html =404;
}

location = /middle { return 301 /console/; }
location ^~ /middle/login { return 302 /login; }
location ^~ /middle/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header x-mammoth-public-api /middle/api;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 50m;
}
location ^~ /middle/ { return 301 /console/; }

# Octop 已废弃：/agent 与旧 /api→8088 不再反代；终端改 DeepSeek Harness
location = /agent { return 302 /console/; }
location ^~ /agent/ { return 302 /console/; }

# 中台 API（含支付回调 /api/pay）；原先误指 Octop :8088
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3100/api/;
