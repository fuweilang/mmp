services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: mammoth-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mammoth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mammoth_core
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mammoth -d mammoth_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mammoth

  # 生产只用预加载镜像；禁止在宝塔上 docker compose build（勿在此加 build:）
  # Octop 服务已废弃；终端改 DeepSeek Harness（sibling 仓库，不在本 compose）
  api:
    image: mammoth-api:local
    container_name: mammoth-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mammoth:${POSTGRES_PASSWORD}@pg:5432/mammoth_core
      PORT: "3100"
      PUBLIC_ORIGIN: https://www.mmai.vip
      OIDC_ISSUER: https://www.mmai.vip/console/api/oidc
      OIDC_CLIENT_ID: mammoth-octop
      COOKIE_NAME: mammothai_access_token
      # 遗留：计价/模型目录曾读 OCTOP_HOME；无 octop.db 时 reader 返回空，不阻断中台
      OCTOP_HOME: /data/.octop
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./data/uploads:/app/apps/backend/uploads
      # PAY_PROVIDER=real 时必须；不要把真实 PEM 提交进 git（只挂宿主机 ./secrets）
      - ./secrets:/app/secrets:ro
      - ./data/octop:/data/.octop:ro
    depends_on:
      pg:
        condition: service_healthy
    networks:
      - mammoth

volumes:
  pgdata:

networks:
  mammoth:
    name: mammoth
