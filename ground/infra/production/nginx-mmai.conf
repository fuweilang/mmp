# Include inside the HTTPS server for www.mmai.vip. Replace the old website locations.
# Canonical bare mmai.vip server should redirect to https://www.mmai.vip$request_uri.
# Keep the existing valid SSL certificate and ACME challenge handling in the Baota server.
client_max_body_size 50m;

location = /agent { return 410; }
location ^~ /agent/ { return 410; }
location = /middle { return 302 /console/; }
location ^~ /middle/ { return 302 /console/; }

# The middle-platform build uses its OWN asset prefix, never the agent /assets/ tree.
location ^~ /middle-static/ {
    alias /www/mmp-prod/middle-web/;
    try_files $uri =404;
    expires 1h;
}
location = /login { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }
location = /console { return 302 /console/; }
location = /admin { return 302 /admin/; }
location ^~ /console/api/ {
    proxy_pass http://127.0.0.1:33100/api/;
    include /www/mmp-prod/proxy-common.conf;
    proxy_set_header x-mammoth-public-api /console/api;
}
location ^~ /console/ { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }
location ^~ /admin/api/ {
    proxy_pass http://127.0.0.1:33100/api/admin/;
    include /www/mmp-prod/proxy-common.conf;
    proxy_set_header x-mammoth-public-api /admin/api;
}
location ^~ /admin/ { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }

# Ground-only public API families; other /api namespaces belong to the agent RPC.
location ~ ^/api/(auth|billing|v1|session-history|oidc)(/|$) {
    proxy_pass http://127.0.0.1:33100;
    include /www/mmp-prod/proxy-common.conf;
}
location = /api/health { proxy_pass http://127.0.0.1:33100; include /www/mmp-prod/proxy-common.conf; }
location = /api/version { proxy_pass http://127.0.0.1:33100; include /www/mmp-prod/proxy-common.conf; }

# Never fall back to index.html for a missing installer/update file.
location ^~ /downloads/ {
    alias /www/mmp-prod/downloads/;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff;
    autoindex off;
}
# Explicit shared logos used by the middle login page.
location = /mengma-logo.png { alias /www/mmp-prod/middle-web/mengma-logo.png; }
location = /logo-icon.png { alias /www/mmp-prod/middle-web/logo-icon.png; }

# The agent owns /, /assets/, /plugins/, /api/* RPC, files and same-origin proxies.
location / {
    proxy_pass http://127.0.0.1:33080;
    include /www/mmp-prod/proxy-common-long.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_send_timeout 3600s;
    proxy_cookie_flags ~ secure httponly samesite=lax;
}
