# Include inside the HTTPS server for www.mmai.vip. Replace the old website locations.
# Canonical bare mmai.vip server should redirect to https://www.mmai.vip$request_uri.
# Keep the existing valid SSL certificate and ACME challenge handling in the Baota server.
client_max_body_size 50m;

# 官网是 nginx 直接发的静态页；本 server 没继承到别处的 gzip 设置，显式打开。
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml text/javascript;
gzip_vary on;

# 官网（Next 静态导出）占用域名根；智能体网页版在 /agent/，中台仍在 /console/ 与 /admin/。
# 宝塔的 server 块已有 root，这里只在 location 内覆盖，避免 "root directive is duplicate"。

# 智能体网页版：身份路由假定自己挂在 origin 根，这里剥掉 /agent/ 前缀再转发。
# 未登录时图标请求不必 401；直接回官网图标。
location = /agent/favicon.svg { return 302 /favicon.png; }
location = /agent/favicon-dark.svg { return 302 /favicon.png; }
location = /agent/apple-touch-icon.png { return 302 /favicon.png; }
location = /agent { return 301 /agent/; }
location ^~ /agent/ {
    proxy_pass http://127.0.0.1:33080/;
    include /www/mmp-prod/proxy-common-long.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_send_timeout 3600s;
    proxy_cookie_flags ~ secure httponly samesite=lax;
}
# 智能体的资源与回调在根上是绝对路径（插件模块、登出），必须一起转到 agent。
location ^~ /plugins/ {
    proxy_pass http://127.0.0.1:33080;
    include /www/mmp-prod/proxy-common-long.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_send_timeout 3600s;
}
location = /auth/ground/logout {
    proxy_pass http://127.0.0.1:33080;
    include /www/mmp-prod/proxy-common.conf;
}
location = /middle { return 302 /console/; }
location ^~ /middle/ { return 302 /console/; }

# The middle-platform build uses its OWN asset prefix, never the agent /assets/ tree.
location ^~ /middle-static/ {
    alias /www/mmp-prod/middle-web/;
    try_files $uri =404;
    expires 1h;
}
location = /login { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }
location = /console { return 302 /console/; }
location = /admin { return 302 /admin/; }
location ^~ /console/api/ {
    proxy_pass http://127.0.0.1:33100/api/;
    include /www/mmp-prod/proxy-common.conf;
    proxy_set_header x-mammoth-public-api /console/api;
}
location ^~ /console/ { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }
location ^~ /admin/api/ {
    proxy_pass http://127.0.0.1:33100/api/admin/;
    include /www/mmp-prod/proxy-common.conf;
    proxy_set_header x-mammoth-public-api /admin/api;
}
location ^~ /admin/ { root /www/mmp-prod/middle-web; try_files /index.html =404; add_header Cache-Control no-store; }

# Payment callbacks always belong to Ground; the agent RPC bridge must never answer them.
location ^~ /api/pay/ {
    proxy_pass http://127.0.0.1:33100;
    include /www/mmp-prod/proxy-common.conf;
}
# 模型回答是长连接（SSE）：只有 v1 网关关闭缓冲并放宽读超时。
# 必须排在下面的通用 Ground 正则之前，否则会被 60s 默认预算吃掉。
location ~ ^/api/v1/ {
    proxy_pass http://127.0.0.1:33100;
    include /www/mmp-prod/proxy-common.conf;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
# Portraits are public branding. Serve a file from disk when the release exported it;
# a miss still reaches the API. This regex is ahead of the Ground API regex so it wins.
location ~ '^/api/official-agents/avatars/([A-Za-z0-9][A-Za-z0-9_-]{0,63}\.(?:jpg|jpeg|png|webp))$' {
    root /www/mmp-prod/brand-avatars;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /uploads/$1 /packaged/$1 @official_avatar_api;
}
location @official_avatar_api {
    proxy_pass http://127.0.0.1:33100;
    include /www/mmp-prod/proxy-common.conf;
}
# Ground-only public API families; other /api namespaces belong to the agent RPC.
location ~ ^/api/(auth|billing|v1|session-history|oidc|library|official-agents|official-skills|official-knowledge)(/|$) {
    proxy_pass http://127.0.0.1:33100;
    include /www/mmp-prod/proxy-common.conf;
}
location = /api/health { proxy_pass http://127.0.0.1:33100; include /www/mmp-prod/proxy-common.conf; }
location = /api/version { proxy_pass http://127.0.0.1:33100; include /www/mmp-prod/proxy-common.conf; }

# Never fall back to index.html for a missing installer/update file.
location ^~ /downloads/ {
    alias /www/mmp-prod/downloads/;
    add_header Cache-Control no-cache;
    add_header X-Content-Type-Options nosniff;
    autoindex off;
}
# Update feeds move only after all target payloads are present. Never cache a feed or its 404.
location ^~ /downloads/mmp-desk/feeds/ {
    alias /www/mmp-prod/downloads/mmp-desk/feeds/;
    default_type application/yaml;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    autoindex off;
}
# Versioned payloads retain static-file Range support; never replace bytes under an existing version.
location ^~ /downloads/mmp-desk/bin/ {
    alias /www/mmp-prod/downloads/mmp-desk/bin/;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    gzip off;
    autoindex off;
}
# The pointer and the fixed aliases must never be cached: a stale manifest or alias
# silently serves the previous client even though the page shows the new version.
location = /downloads/mammoth-latest.json {
    alias /www/mmp-prod/downloads/mammoth-latest.json;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    add_header X-Content-Type-Options nosniff;
}
location = /downloads/mammoth-agent-mac-arm64.dmg {
    alias /www/mmp-prod/downloads/mammoth-agent-mac-arm64.dmg;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    add_header X-Content-Type-Options nosniff;
}
location = /downloads/mammoth-agent-mac-x64.dmg {
    alias /www/mmp-prod/downloads/mammoth-agent-mac-x64.dmg;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    add_header X-Content-Type-Options nosniff;
}
location = /downloads/mammoth-agent-win.exe {
    alias /www/mmp-prod/downloads/mammoth-agent-win.exe;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    add_header Pragma no-cache;
    add_header X-Content-Type-Options nosniff;
}
# Explicit shared logos used by the middle login page.
location = /mengma-logo.png { alias /www/mmp-prod/middle-web/mengma-logo.png; }
location = /logo-icon.png { alias /www/mmp-prod/middle-web/logo-icon.png; }

# 智能体 RPC 仍留在根：普通前缀（不能用 ^~），上面的 Ground 正则与精确匹配仍然优先。
location = /api {
    proxy_pass http://127.0.0.1:33080;
    include /www/mmp-prod/proxy-common-long.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_send_timeout 3600s;
}
location /api/ {
    proxy_pass http://127.0.0.1:33080;
    include /www/mmp-prod/proxy-common-long.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_send_timeout 3600s;
}

# 官网静态页（Next 静态导出）。/privacy 由 $uri.html 命中，404 走导出的 404.html。
location ^~ /_next/static/ {
    root /www/mmp-prod/website;
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /favicon.ico { return 302 /favicon.png; }
location / {
    root /www/mmp-prod/website;
    index index.html;
    try_files $uri $uri.html $uri/ =404;
    add_header Cache-Control "no-cache";
}
error_page 404 /404.html;
location = /404.html {
    internal;
    root /www/mmp-prod/website;
}
