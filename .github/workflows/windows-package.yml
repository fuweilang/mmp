# 猛犸桌面客户端 · Windows x64 安装包（未签名）
#
# 仓库根目录的 workflow 是 GitHub Actions 唯一识别的入口；mammoth-agent/.github
# 下的同名流水线依赖自托管 runner，本文件只用于在 GitHub 托管 runner 上产出一份
# 未签名 Windows 安装包，供宝塔下载页分发（不生成更新 feed、不签名、不发布到 COS）。
name: Package Desktop · Windows x64 (unsigned, Baota)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '打包源码分支或 tag；默认 5.0'
        type: string
        default: '5.0'
        required: true

permissions:
  contents: read

concurrency:
  group: windows-baota-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
        working-directory: mammoth-agent
    env:
      CI: '1'
      MMP_TELEMETRY_DISABLED: '1'
      # 未签名包：避免 electron-builder 尝试发现证书
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
          cache: pnpm
          cache-dependency-path: mammoth-agent/pnpm-lock.yaml

      - name: Show versions
        run: |
          node -v
          corepack pnpm -v
          git rev-parse HEAD

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # 客户端 tsconfig 会引用 ../ground/apps/backend/src/library，类型解析需要 ground 自己的
      # node_modules（jszip/pdf-parse/fast-xml-parser/sharp）。只装依赖，不构建 Ground。
      - name: Install Ground dependencies
        working-directory: ground
        run: corepack pnpm install --frozen-lockfile

      # .env.windows 被 .gitignore 忽略，CI 按需生成：身份与已发布 Mac 包一致，
      # 策略服务指向生产域名；未签名安装包不读取任何证书配置。
      - name: Write Windows packaging environment
        shell: pwsh
        run: |
          $content = @(
            'MMP_DESKTOP_APP_ID=com.deepseek.harness'
            'MMP_DESKTOP_AUTO_UPDATE_ENV=production'
            'MMP_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://www.mmai.vip'
            'MMP_DESKTOP_MANDATORY_UPDATE_CONFIG={}'
            'MMP_DESKTOP_WINDOWS_COMPRESSION_LEVEL=3'
          ) -join "`n"
          [System.IO.File]::WriteAllText('apps/desktop/.env.windows', $content + "`n", [System.Text.UTF8Encoding]::new($false))

      - name: Package Windows x64 (unsigned)
        run: corepack pnpm --dir apps/desktop run package:win:x64:unsigned

      - name: Collect installer
        run: |
          $dir = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          Get-ChildItem -Recurse $dir | Select-Object FullName,Length
          $exe = Get-ChildItem -Path $dir -Filter '*-win-x64-unsigned.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw "no unsigned win-x64 installer in $dir" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "INSTALLER=$($exe.FullName)"
          "BYTES=$($exe.Length)"
          "SHA256=$hash"
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item $exe.FullName (Join-Path $out $exe.Name)
          Copy-Item "$dir/*.blockmap" $out -ErrorAction SilentlyContinue
          Copy-Item "$dir/latest.yml" $out -ErrorAction SilentlyContinue
          Get-ChildItem $out | Select-Object Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mammoth-agent-win-x64-unsigned
          path: windows-artifact/*
          if-no-files-found: error
          retention-days: 14
